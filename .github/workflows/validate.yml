name: Validate rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate every rule (schema + safety rules)
        run: npm run validate
      - name: Run the rule tests
        run: npm test
      - name: Build the catalogue (smoke test)
        run: npm run build
